[workspace]
members = ["slog-fuse", "slog-sqlite"]

[package]
name = "slog"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "General-purpose event sourcing on OpenData Log / SlateDB and object storage."
repository = "https://github.com/aaazzam/slog"

[dependencies]
slatedb = "0.15"
object_store = "0.14"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "time"] }
ulid = "1"
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[package.metadata.docs.rs]
all-features = true
