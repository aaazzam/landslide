[package]
name = "slog-sqlite"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "SQLite replicated onto a slog volume: WAL transactions stream out as page deltas and reconstruct anywhere."

[dependencies]
slog = { path = ".." }
object_store = "0.14"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
bincode = "1"
zstd = "0.13"
ulid = "1"
tokio = { version = "1", features = ["macros", "sync"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
object_store = { version = "0.14", features = ["aws"] }
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
proptest = "1"
async-trait = "0.1"
