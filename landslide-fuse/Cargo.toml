[package]
name = "landslide-fuse"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "FUSE overlay filesystem whose deltas stream into a landslide volume."

[features]
default = []
# The FUSE adapter requires libfuse (Linux) or macFUSE (macOS) at build time.
fuse = ["dep:fuser"]

[dependencies]
landslide = { path = ".." }
object_store = { version = "0.14", features = ["aws"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
ulid = "1"
tokio = { version = "1", features = ["sync", "rt", "time"] }
fuser = { version = "0.18", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# The churn demo drives the FUSE mount; it only builds with the adapter on.
[[example]]
name = "churn"
required-features = ["fuse"]
